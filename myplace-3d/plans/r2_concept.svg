<g transform="translate(60,1210)" font-size="15" fill="#222"><text y="0" font-weight="700" font-size="17">แนวคิด R2 "Recovery Courtyard" — จัดใหม่ทั้งโซนหลังแบบไม่ยึดผังเดิม (เทียบกับ REV D.12)</text><text y="36" >1. ของเปียกและหนักทั้งหมด (ซาวน่า สตีม Cold Plunge ฝักบัว HBOT) ลงพื้นดิน → พื้น คสล. เดิมชั้น 2 รับแค่ใช้งานเบา/แห้ง ไม่ต้องเดินท่อน้ำบนพื้นเดิม</text><text y="72" >2. ทางเดินฟื้นฟูวิ่งตลอดแนวฝั่งโถงแบด (กันเสียง) ทุกห้องหันหน้าออกสวนทิศเหนือ แสงนุ่ม เงียบ · ระเบียงชมแบดสาธารณะ แยกจากห้องด้วยผนังทึบ</text><text y="108" >3. แกนใหม่ทิศตะวันออก = บันไดหนีไฟชุดที่ 2 (แก้ปัญหาบันได 0.95 ม.) + ทางขึ้นทางเดิน +4.50 + ผนังปีนผา 12 ม. หน้าตาอาคาร · ยกเลิกชานพัก/บันไดลอยเดิม</text><text y="144" >4. ศาลาร้อน-เย็นชั้นเดียว หลังคาสวน ปิดลานด้านตะวันออก: วงจร ซาวน่า → อาบน้ำเย็น → พักบนลาน → สระ → ยิมฟื้นฟู ครบในวงเดียว</text><text y="180" >5. ลานโยคะย้ายไปฝั่งตะวันตกที่เงียบ ใต้ทรงพุ่มมะพร้าว · ห้องน้ำ/เก็บของชั้น 3 อยู่ข้างแกนใหม่ (ไม่ต้องเดินผ่านสตูดิโอ)</text><text y="216" >ต้องตรวจ: ศาลาและแกนใหม่เป็นอาคารใหม่ (ฐานราก/ระยะร่น/พื้นที่ก่อสร้างเพิ่ม ≈ 70 ตร.ม.) · ห้องเปลี่ยนชุดในศาลาไกลจากโถงแบด (ผู้เล่นแบดใช้ห้องในปีกตะวันตก/ล็อบบี้แทน)</text></g>
